name: Scheduled Check-In Job
on:
  schedule:
    - cron: '0 9 * * *'   # UTC 09:00 = 北京时间 17:00；想改北京时间09:00就改成 '0 1 * * *'
  workflow_dispatch:      # 手动触发入口

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16'

      - name: Install Dependencies
        run: |
          npm install
          npm install node-fetch

      - name: Run Check-In
        id: checkin
        env:
          JC_TYPE: ${{ secrets.JC_TYPE }}
          DOMAIN: ${{ secrets.DOMAIN }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_ID: ${{ secrets.TG_ID }}
        run: |
          set -o pipefail
          node _worker.js 2>&1 | tee output.log

      - name: Bark Notification
        if: always()
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # 从日志提取 ret 和 msg
          RET=$(grep -oP 'ret:\s*\K\d+' output.log | head -1)
          RAW_MSG=$(grep -oP "msg:\s*'\K[^']*" output.log | head -1)
          CLEAN_MSG=$(echo "$RAW_MSG" | sed 's/\\n/ /g' | tr -s ' ')

          echo "===== Bark 推送内容 ====="
          echo "ret=$RET"
          echo "msg=$CLEAN_MSG"

          # 根据状态决定标题
          if [ "$JOB_STATUS" != "success" ]; then
            TITLE="签到任务❌"
            BODY="脚本执行失败，请查看 Actions 日志"
          elif [ "$RET" = "0" ]; then
            TITLE="签到任务⚠️"
            BODY="$CLEAN_MSG"
          elif [ "$RET" = "1" ]; then
            TITLE="签到任务✅"
            BODY="$CLEAN_MSG"
          else
            TITLE="签到任务ℹ️"
            BODY="${CLEAN_MSG:-未知结果}"
          fi

          # URL 编码
          ENC_TITLE=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$TITLE")
          ENC_BODY=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$BODY")

          curl -s "https://api.day.app/${BARK_KEY}/${ENC_TITLE}/${ENC_BODY}?group=签到脚本&ttl=600"
          echo ""
